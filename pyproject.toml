[project]
name = "fabopsy-lib"
description = "Face and body based psychology analysis"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "jsonschema2md>=1.7.0",
    "packaging>=25.0",
    "platformdirs>=4.5.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "tomli>=2.3.0; python_version < '3.11'",
    "tqdm>=4.67.2",
    "nvidia-ml-py>=13.595.45",
]

[project.optional-dependencies]
webui = [
    "streamlit>=1.53.0",
]
dev = [
    "fabopsy-lib[webui]",
    "onnxruntime-gpu>=1.24; python_version > '3.10'",
    "onnxruntime-gpu<1.24; python_version <= '3.10'",
    "opencv-python>=4.13.0.90",
    "build>=1.4.4",
    "twine>=6.2.0",
    "huggingface-hub>=1.6.0",
    "modelscope>=1.34.0",
    "aistudio-sdk>=0.3.8",
]

[project.scripts]
fabopsy-webui = "fabopsy_lib.webui.cli:main"
fabopsy-manager = "fabopsy_lib.manager.cli:main"

[dependency-groups]
dev = [
    "fabopsy-lib[dev]",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
tag-pattern = "^r(?P<version>[^-]+)$"

[tool.hatch.build.hooks.vcs]
version-file = "fabopsy_lib/_version.py"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fabopsy_lib"]

[tool.hatch.build.targets.wheel.package-data]
fabopsy_lib = ["modules/*.yml"]
