[project]
name = "fabopsy-lib"
version = "0.1.0"
description = "Face and body based psychology analysis"
requires-python = ">=3.10"
dependencies = [
    "jsonschema2md>=1.7.0",
    "packaging>=25.0",
    "platformdirs>=4.5.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "tomli>=2.3.0",
    "tqdm>=4.67.2",
    "huggingface_hub>=1.6.0",
    "modelscope>=1.34.0",
    "aistudio-sdk>=0.3.8",
    "nvidia-ml-py>=13.595.45",
]

[tool.setuptools.package-data]
fabopsy_lib = [
    "modules/*.json",
    "modules/*.toml",
    "modules/*.yaml",
    "modules/*.yml"
]

[dependency-groups]
dev = [
    "onnxruntime-gpu>=1.24; python_version > '3.10'",
    "onnxruntime-gpu<1.24; python_version <= '3.10'",
    "opencv-python>=4.13.0.90",
    "streamlit>=1.53.0",
]
