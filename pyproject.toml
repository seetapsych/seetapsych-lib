[project]
name = "seetapsych-lib"
description = "A Computer Vision Toolkit for Face-based Psychological Measurement"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema2md>=1.7.0",
    "packaging>=25.0",
    "platformdirs>=4.5.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "tomli>=2.3.0",
    "tqdm>=4.67.2",
    "nvidia-ml-py>=13.595.45",
]

[project.urls]
Homepage = "https://github.com/seetapsych/seetapsych-lib"
Repository = "https://github.com/seetapsych/seetapsych-lib"
Issues = "https://github.com/seetapsych/seetapsych-lib/issues"

[project.optional-dependencies]
webui = [
    "streamlit>=1.53.0",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.90",
]
dev = [
    "seetapsych-lib[webui]",
    "onnxruntime>=1.24; sys_platform == 'darwin' and python_version > '3.10'",
    "onnxruntime<1.24; sys_platform == 'darwin' and python_version <= '3.10'",
    "onnxruntime-gpu>=1.24; sys_platform != 'darwin' and python_version > '3.10'",
    "onnxruntime-gpu<1.24; sys_platform != 'darwin' and python_version <= '3.10'",
    "opencv-python>=4.13.0.90",
    # build tools
    "build>=1.4.4",
    "twine>=6.2.0",
    # model hub SDKs
    "huggingface-hub>=1.6.0",
    "modelscope>=1.34.0",
    "aistudio-sdk>=0.3.8",
    # test tools
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    # type stubs
    "types-PyYAML>=6.0",
]

[project.scripts]
seetapsych-webui = "seetapsych_lib.webui.cli:main"
seetapsych-manager = "seetapsych_lib.manager.cli:main"

[dependency-groups]
dev = [
    "seetapsych-lib[dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    "seetapsych_lib/_version.py",
]

[tool.ruff.lint]
select = [
    "E",  # PEP 8 syntax / style errors (pycodestyle)
    "F",  # Undefined names, unused imports, logical errors (Pyflakes)
    "B",  # Common logic pitfalls (flake8-bugbear: mutable defaults, bare except, etc.)
    "I",  # Import ordering and grouping (isort)
    "ANN001",  # Missing type annotation for function argument (flake8-annotations)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
plugins = []
# Recommended checks (not covered by strict=false)
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["annotation-unchecked"]
exclude = [
    "seetapsych_lib/_version.py",
    "tests/",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "dist",
    "build",
]
skips = [
    "B101",  # assert used - defensive checks are intentional
    "B110",  # try_except_pass - fallback patterns are intentional
    "B112",  # try_except_continue - fallback patterns are intentional
    "B404",  # subprocess import - safe internal usage
    "B602",  # subprocess shell=True - safe internal commands only
    "B603",  # subprocess without shell=True - safe internal commands
    "B607",  # partial executable path - platform detection tools
    "B310",  # urllib urlopen - safe URL downloads from trusted sources
    "B402",  # ftplib import - legacy download support
    "B321",  # ftplib calls - legacy download support
    "B615",  # huggingface unsafe download - revision controlled upstream
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
tag-pattern = "^r(?P<version>[^-]+)$"

[tool.hatch.build.hooks.vcs]
version-file = "seetapsych_lib/_version.py"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seetapsych_lib"]

[tool.hatch.build.targets.wheel.package-data]
seetapsych_lib = [
    "modules/**/*.yml",
    "example/**/*.yml",
]
