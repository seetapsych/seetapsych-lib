[project]
name = "fabopsy-lib"
version = "0.0.2"
description = "Face and body based psychology analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema2md>=1.7.0",
    "packaging>=25.0",
    "platformdirs>=4.5.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "tomli>=2.3.0",
    "tqdm>=4.67.2",
    "nvidia-ml-py>=13.595.45",
]

[dependency-groups]
dev = [
    "onnxruntime-gpu>=1.24; python_version > '3.10'",
    "onnxruntime-gpu<1.24; python_version <= '3.10'",
    "opencv-python>=4.13.0.90",
    "streamlit>=1.53.0",
    "build>=1.4.4",
    "twine>=6.2.0",
    "huggingface-hub>=1.6.0",
    "modelscope>=1.34.0",
    "aistudio-sdk>=0.3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools.package-data]
fabopsy_lib = [
    "modules/*.json",
    "modules/*.toml",
    "modules/*.yaml",
    "modules/*.yml"
]

[project.scripts]
fabopsy-webui = "fabopsy_lib.webui.cli:main"
