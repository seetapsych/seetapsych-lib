version: '1.0'
module:
  uid: d8a05838-8c5e-43d4-b158-dae7da1c6753
  name: SelectFace
  version: '1.0'
  description: 'Select one target face from multi-face detection outputs for single-face downstream pipelines.'
  keywords:
    - Face
    - Selection
packages:
  - uid: bb212f54-aace-438f-9cb7-f6519f4fef48
    name: SelectFace
    description: Select one face from detections by max area or max-tracking with PID increments on target change
    version: '1.0'
    usage_models: []
    inputs: []
    provides:
      - face/selection
      - face/detection
    requires:
      - face/detection
    entry:
      method: seetapsych_lib.toolkit.packages.face_selection.load
    parameters:
      - name: selection_mode
        type: selection
        value: MAX_TRACKING
        selection: [MAX_TRACKING, MAX]
        text: Selection Mode
        description: Strategy for selecting from multiple faces. MAX_TRACKING adds temporal stability and increments PID on target switch; MAX picks the largest face every frame.
    models: []
